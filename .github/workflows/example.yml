# Example consumer workflow. Copy this into your own repo at
# .github/workflows/deploy-guard.yml
name: Deploy Guard
on: pull_request
permissions:
  contents: read
  pull-requests: write
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: ivosetyadi/deploy-guard@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          fail-on: error
